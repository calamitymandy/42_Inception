#
# Optimized configuration file for a 2GB RAM environment
#

[server]

[mysqld]

# Basic settings
user                    = mysql								# The user that runs the MySQL/MariaDB service
pid-file                = /run/mysqld/mysqld.pid			# Location of the file containing the process ID (PID)
socket                  = /run/mysqld/mysqld.sock			# The socket used for local connections
port                    = 3306								# Default port for MySQL/MariaDB
basedir                 = /usr								# Installation base directory
datadir                 = /var/lib/mysql					# Directory where database files are stored
tmpdir                  = /tmp								# Directory for temporary files
lc-messages-dir         = /usr/share/mysql					# Directory for language message files
bind-address            = 0.0.0.0  							# Allow external connections (localhost is more compatible and is not less secure than 127.0.0.1)

# Limit the number of connections to prevent overload
max_connections         = 100                   			# Limits the number of concurrent connections to 100

# Memory and buffer optimization
key_buffer_size         = 16M                  				# Memory for MyISAM index blocks
max_allowed_packet      = 16M                   			# Max size for communication packets
table_open_cache        = 64                   				# Number of tables that can be cached in the open state
sort_buffer_size        = 512K                  			# Buffer for sorting data
read_buffer_size        = 256K                  			# Buffer for sequential reading
read_rnd_buffer_size    = 512K                  			# Buffer for random reading
myisam_sort_buffer_size = 8M                    			# Buffer for sorting during MyISAM table index creation

# InnoDB settings (default storage engine)
innodb_buffer_pool_size = 256M								# Buffer for caching data and indexes, optimized for 2GB of RAM
innodb_log_file_size    = 64M								# Size of each log file in the log group
innodb_log_buffer_size  = 8M								# Memory allocated for buffering log data before writing it to disk
innodb_flush_method     = O_DIRECT							# Avoids filesystem cache for better performance
innodb_file_per_table   = 1 								# Store each table's data and indexes in its own file
innodb_flush_log_at_trx_commit = 1							# Ensures durability by flushing logs to disk after each transaction

# Query Cache configuration
query_cache_size        = 16M								# Enables a small cache to store query results
query_cache_limit       = 1M								# Limits the size of individual queries that can be cached to 1MB

# Logging configuration
log_error               = /var/log/mysql/error.log			# Log errors to this file
slow_query_log          = 1									# Enables logging of slow queries
slow_query_log_file     = /var/log/mysql/mariadb-slow.log	# Log slow queries to this file
long_query_time         = 2									# Any query taking longer than 2 seconds is logged

# Binary logs expiration to free up space
expire_logs_days        = 10								# Remove binary logs older than 10 days to save space

# Security settings
ssl                     = off								# SSL is disabled for simplicity in development/testing environments
skip_external_locking   = 1									# Disables external locking, useful in small environments

# Character set
character-set-server    = utf8mb4							# Default character set to handle multi-byte characters
collation-server        = utf8mb4_general_ci				# Default collation for character set

[mariadb]

[mariadb-10.5]
